<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<title>Oikonomia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section id="welcome" class="welcome" hidden aria-labelledby="welcome-title">
  <div class="welcome-inner">
    <img src="icon.svg" alt="" width="56" height="56" class="welcome-mark">
    <h2 id="welcome-title" class="welcome-title">Which language will you speak?</h2>
    <p class="welcome-note">For adding expenses with your voice. You can change this any time.</p>
    <div class="welcome-choices">
      <button type="button" class="welcome-choice" data-language="en-IN">English</button>
      <button type="button" class="welcome-choice" data-language="hi-IN">हिन्दी</button>
    </div>
  </div>
</section>

<main id="home" class="screen">
  <header class="masthead">
    <h1>Oikonomia</h1>
  </header>

  <section class="headline" aria-live="polite">
    <p class="headline-label" id="headline-label">Spent this month</p>
    <p class="headline-figure" id="headline-figure">₹0</p>
    <p class="headline-note" id="headline-note">Nothing recorded yet.</p>
  </section>

  <button id="add-button" class="primary-action" type="button">
    <span aria-hidden="true">+</span> Add expense
  </button>

  <section class="entries" aria-labelledby="entries-heading">
    <h2 id="entries-heading" class="entries-heading">Recent</h2>
    <ul id="entry-list" class="entry-list"></ul>
    <p id="entries-empty" class="entries-empty">
      Anything you add will appear here.
    </p>
  </section>
</main>

<div id="sheet-backdrop" class="sheet-backdrop" hidden></div>

<section id="sheet" class="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheet-title">
  <form id="entry-form" novalidate>
    <h2 id="sheet-title" class="sheet-title">Add expense</h2>

    <button type="button" id="voice-button" class="voice-action" hidden>
      <span class="voice-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
          <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z"/>
          <path d="M18 11a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.1A6 6 0 0 0 18 11Z"/>
        </svg>
      </span>
      <span id="voice-label">Say it instead</span>
    </button>

    <p id="voice-language" class="voice-language" hidden>
      <label for="language">Speaking in</label>
      <select id="language" name="language">
        <option value="en-IN">English</option>
        <option value="hi-IN">हिन्दी</option>
      </select>
    </p>

    <p id="voice-heard" class="voice-heard" hidden></p>

    <p id="voice-divider" class="voice-divider" hidden><span>or type it</span></p>

    <label class="field">
      <span class="field-label">How much?</span>
      <div class="amount-input">
        <span class="amount-prefix" aria-hidden="true">₹</span>
        <input id="amount" name="amount" type="text" inputmode="decimal"
               autocomplete="off" placeholder="0" required>
      </div>
    </label>

    <label class="field">
      <span class="field-label">What was it?</span>
      <input id="note" name="note" type="text" autocomplete="off"
             placeholder="Milk, cab, school books…">
    </label>

    <p id="form-error" class="form-error" hidden></p>

    <div class="sheet-actions">
      <button type="button" id="cancel-button" class="secondary-action">Cancel</button>
      <button type="submit" id="save-button" class="primary-action">Save</button>
    </div>

    <button type="button" id="delete-button" class="delete-action" hidden>
      Remove this expense
    </button>
  </form>
</section>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
