<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15503c">
<title>Oikonomia — household money, in ordinary language</title>
<meta name="description" content="A free household budgeting companion for Indian families. Reads your bank statements on your own phone, plans around what you actually spend, and never sends your finances anywhere.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body class="landing-body">

<main class="landing landing-simple">

  <header class="landing-head">
    <img src="icon-512.png" alt="" width="96" height="96" class="landing-mark">
    <h1 class="landing-name">Oikonomia</h1>
    <p class="landing-greek">the care of a household</p>
  </header>

  <p class="landing-lead">
    Money is something entrusted to us.<br>
    Let's look after it well.
  </p>

  <div id="trouble" class="landing-trouble" hidden></div>

  <a id="sign-in" class="primary-action landing-action" href="/api/auth/google/start">
    Continue with Google
  </a>

  <p class="landing-note">
    Free · Your statements never leave your phone · No bank login
  </p>

  <footer class="landing-foot">
    <nav class="landing-links">
      <a href="/about.html">About</a>
      <a href="/privacy.html">Privacy</a>
      <a href="/terms.html">Terms</a>
      <a href="/contact.html">Contact</a>
    </nav>
    <p class="landing-foot-note">
      Household guidance, not professional financial advice.
    </p>
  </footer>

</main>

<script type="module">
  const reasons = {
    cancelled: 'Sign-in was cancelled. Nothing has changed — try again whenever you like.',
    expired: 'That sign-in took too long and expired. Please try once more.',
    failed: 'Something went wrong signing in. Please try once more.'
  };

  const trouble = new URL(location.href).searchParams.get('trouble');
  if (trouble && reasons[trouble]) {
    const box = document.getElementById('trouble');
    box.textContent = reasons[trouble];
    box.hidden = false;
  }

  try {
    const response = await fetch('/api/auth/session');
    if (response.ok) {
      const session = await response.json();
      if (session.signedIn) location.replace('/app');
      else if (!session.configured) {
        const button = document.getElementById('sign-in');
        button.textContent = 'Continue without signing in';
        button.href = '/app';
      }
    }
  } catch {
    // Offline, or the service is unreachable. The button still works.
  }
</script>

</body>
</html>
